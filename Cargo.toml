[package]
name = "termvault"
version = "0.1.6"
edition = "2021"
rust-version = "1.89"
description = "A local, terminal-first KDBX password vault (experimental MVP)"
license = "MIT"
repository = "https://github.com/Andrey89711/TermVault"
readme = "README.md"
default-run = "tvault"

[[bin]]
name = "tvault"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { package = "rust-argon2", version = "3" }
arboard = { version = "3.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
csv = "1.4"
dirs = "6"
getrandom = "0.3"
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }
ratatui = "0.29"
tempfile = "3"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
